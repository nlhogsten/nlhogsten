<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 332" width="440" height="332" role="img" aria-label="AI platform and full-stack engineer based in Honolulu, architecting an internal AI developer platform and building production systems across the stack, from frontend apps and backend services to data warehouses, pipelines, and cloud infrastructure. Trained as a chemist at UH Mānoa, with a background in lab research and environmental data analysis, and the founder of Kaimuki Compost Collective, which ran from 2022 to 2025 on software built in-house.. A personal GitHub for creative projects and experiments; professional work lives in private repositories."><title>AI platform and full-stack engineer based in Honolulu, architecting an internal AI developer platform and building production systems across the stack, from frontend apps and backend services to data warehouses, pipelines, and cloud infrastructure. Trained as a chemist at UH Mānoa, with a background in lab research and environmental data analysis, and the founder of Kaimuki Compost Collective, which ran from 2022 to 2025 on software built in-house.. A personal GitHub for creative projects and experiments; professional work lives in private repositories.</title><style>@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Syne';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(-80px,-14px)}}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="440" height="332" rx="12" fill="#f6f7fa"/><defs><filter id="sl1" x="-300%" y="-10%" width="700%" height="120%"><feGaussianBlur stdDeviation="4"/></filter></defs><g style="animation:breathe 4.5s ease-in-out -0.8s infinite"><line x1="18" y1="26" x2="18" y2="308" stroke="#0a8db3" stroke-width="8" filter="url(#sl1)" opacity="0.75"/><line x1="18" y1="26" x2="18" y2="308" stroke="#0a8db3" stroke-width="2"/></g><text x="36" y="42" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">AI platform and full-stack engineer based in Honolulu,</text><text x="36" y="64" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">architecting an internal AI developer platform and</text><text x="36" y="86" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">building production systems across the stack, from</text><text x="36" y="108" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">frontend apps and backend services to data</text><text x="36" y="130" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">warehouses, pipelines, and cloud infrastructure. Trained</text><text x="36" y="152" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">as a chemist at UH Mānoa, with a background in lab</text><text x="36" y="174" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">research and environmental data analysis, and the</text><text x="36" y="196" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">founder of Kaimuki Compost Collective, which ran from</text><text x="36" y="218" fill="#121726" font-family="Syne" font-size="13.5" font-weight="600" letter-spacing="0">2022 to 2025 on software built in-house.</text><text x="36" y="252" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">A personal GitHub for creative projects and</text><text x="36" y="270" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">experiments; professional work lives in private</text><text x="36" y="288" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">repositories.</text></svg>