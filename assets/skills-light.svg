<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 317" width="880" height="317" role="img" aria-label="AI PLATFORM: architecture of internal AI developer platforms: agent harnesses across Claude Code, Codex and Cursor, MCP servers and routing, shared skills and context, hooks, permissions and governed sessions, run tracking with audit trails, and the CLI that ties it together. FRONTEND: production web apps and data-heavy dashboards in TypeScript, React, Next.js and Vite, with Tailwind, component systems, charting, and end-to-end testing in Playwright. BACKEND: services and APIs in TypeScript (Node, Express, NestJS, Bun/Hono), Python (FastAPI) and Rust: REST APIs, auth, background jobs, and Postgres / Supabase data layers. DATA WAREHOUSES + PIPELINES: Snowflake and Postgres warehouses modeled with dbt and SQL, ingestion orchestrated on AWS Step Functions and ECS, backfills, data quality checks, and the analytics layers that APIs and dashboards read from. CI/CD + INFRASTRUCTURE: GitHub Actions and Azure DevOps pipelines, infrastructure as code in Terraform, Docker, and cloud across AWS, Azure and Google Cloud."><title>AI PLATFORM: architecture of internal AI developer platforms: agent harnesses across Claude Code, Codex and Cursor, MCP servers and routing, shared skills and context, hooks, permissions and governed sessions, run tracking with audit trails, and the CLI that ties it together. FRONTEND: production web apps and data-heavy dashboards in TypeScript, React, Next.js and Vite, with Tailwind, component systems, charting, and end-to-end testing in Playwright. BACKEND: services and APIs in TypeScript (Node, Express, NestJS, Bun/Hono), Python (FastAPI) and Rust: REST APIs, auth, background jobs, and Postgres / Supabase data layers. DATA WAREHOUSES + PIPELINES: Snowflake and Postgres warehouses modeled with dbt and SQL, ingestion orchestrated on AWS Step Functions and ECS, backfills, data quality checks, and the analytics layers that APIs and dashboards read from. CI/CD + INFRASTRUCTURE: GitHub Actions and Azure DevOps pipelines, infrastructure as code in Terraform, Docker, and cloud across AWS, Azure and Google Cloud.</title><style>@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(-80px,-14px)}}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="880" height="317" rx="12" fill="#f6f7fa"/><defs><filter id="sl1" x="-300%" y="-10%" width="700%" height="120%"><feGaussianBlur stdDeviation="4"/></filter></defs><g style="animation:breathe 5s ease-in-out -1.5s infinite"><line x1="28" y1="26" x2="28" y2="293" stroke="#d6362a" stroke-width="8" filter="url(#sl1)" opacity="0.75"/><line x1="28" y1="26" x2="28" y2="293" stroke="#d6362a" stroke-width="2"/></g><text x="52" y="42" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0"><tspan fill="#d6362a" font-weight="600">AI PLATFORM</tspan> — architecture of internal AI developer platforms: agent harnesses across Claude Code, Codex and</text><text x="52" y="60" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">Cursor, MCP servers and routing, shared skills and context, hooks, permissions and governed sessions, run tracking</text><text x="52" y="78" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">with audit trails, and the CLI that ties it together.</text><text x="52" y="105" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0"><tspan fill="#0a8db3" font-weight="600">FRONTEND</tspan> — production web apps and data-heavy dashboards in TypeScript, React, Next.js and Vite, with Tailwind,</text><text x="52" y="123" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">component systems, charting, and end-to-end testing in Playwright.</text><text x="52" y="150" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0"><tspan fill="#0a8db3" font-weight="600">BACKEND</tspan> — services and APIs in TypeScript (Node, Express, NestJS, Bun/Hono), Python (FastAPI) and Rust: REST APIs,</text><text x="52" y="168" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">auth, background jobs, and Postgres / Supabase data layers.</text><text x="52" y="195" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0"><tspan fill="#3a47d6" font-weight="600">DATA WAREHOUSES + PIPELINES</tspan> — Snowflake and Postgres warehouses modeled with dbt and SQL, ingestion orchestrated</text><text x="52" y="213" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">on AWS Step Functions and ECS, backfills, data quality checks, and the analytics layers that APIs and dashboards</text><text x="52" y="231" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">read from.</text><text x="52" y="258" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0"><tspan fill="#3a47d6" font-weight="600">CI/CD + INFRASTRUCTURE</tspan> — GitHub Actions and Azure DevOps pipelines, infrastructure as code in Terraform, Docker,</text><text x="52" y="276" fill="#2c3344" font-family="IBM Plex Mono" font-size="11.5" font-weight="400" letter-spacing="0">and cloud across AWS, Azure and Google Cloud.</text></svg>